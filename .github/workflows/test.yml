name: Level-Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Alle Level müssen lösbar sein
        run: npm test
      - name: index.html muss zum Quellcode passen
        run: |
          npm run build
          git diff --exit-code index.html || (echo "index.html ist veraltet – bitte 'npm run build' ausführen und committen." && exit 1)
